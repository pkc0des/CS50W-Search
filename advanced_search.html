<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Search</title>
    <link rel="stylesheet" href="advanced_search_style.css">
</head>
<body>
    <h3 id="google-label">Google</h3>
    <hr>
    <br>
    <div id="container">
        <h2>Advanced Search</h2>
        <h4>Find all pages with</h4>

        <form action="https://www.google.com/search" id="search_form">

        
            <div>
                <label>all these words: </label>
                <input name="as_q">
            </div>
    
            
            <br>

            <div>
                <label>this exact word or phrase:</label>
                <input name="as_epq"> 
            </div>
            
            <br>

            <div>
                <label>any of these words:</label>
                <input name="as_oq">
            </div>
            
            <br>
            
            <div>
                <label>none of these words:</label>
                <input name="as_eq">
            </div>
            <div>
                <button type="submit" id="submit_button">Advanced Search</button>
            </div>
        </form>


    

    </div>
    
</body>
</html>
